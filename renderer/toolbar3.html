* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; background: linear-gradient(90deg, #0c2748, #1c5296); color: #fff; font: 14px "Segoe UI", system-ui, Tahoma, sans-serif; }

button { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); border-radius: 20px; padding: 6px 16px; }
button:hover { background: rgba(255,255,255,.24); }
button.x { padding: 6px 11px; }
